<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.og_image %}<meta property="og:image" content="{{ page.og_image | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
{% else %}<meta name="twitter:card" content="summary">
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header-bar">
  <div class="site-shell">
    <a class="nav-brand" href="{{ '/' | relative_url }}"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15.5" fill="none" stroke="var(--color-accent-700)" stroke-width="3"/><circle cx="35" cy="20" r="4" fill="var(--color-accent-700)"/></svg>{{ site.title }}</a>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="https://www.linkedin.com/in/aditya32001/" target="_blank" rel="noopener noreferrer" aria-label="About Aditya Chauhan — opens LinkedIn profile in a new tab">About<span class="ext-icon" aria-hidden="true"> ↗</span></a>
    </nav>
  </div>
</header>
<main class="site-shell">{{ content }}</main>
<footer class="site-footer-bar">
  <div class="site-shell">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }}
  </div>
</footer>
</body>
</html>
