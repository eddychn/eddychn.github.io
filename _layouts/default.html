<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header-bar">
  <div class="site-shell">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
<main class="site-shell">{{ content }}</main>
<footer class="site-footer-bar">
  <div class="site-shell">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }} &middot; <a href="mailto:adtchauhan123@gmail.com">Email</a> &middot; <a href="https://github.com/eddychn">GitHub</a> &middot; <a href="https://www.linkedin.com/in/aditya32001/">LinkedIn</a>
  </div>
</footer>
</body>
</html>
