---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-standfirst">{{ page.subtitle }}</p>{% endif %}
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
  {% if page.tags and page.tags.size > 0 %}
  <ul class="post-tags" aria-label="Topics">
    {% for tag in page.tags %}<li class="tag tag-neutral">{{ tag }}</li>{% endfor %}
  </ul>
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
</article>
